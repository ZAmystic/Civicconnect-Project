name: CI

# Pre-merge gate: runs on every PR targeting main or UAT-DEMO
on:
  pull_request:
    branches: [main, UAT-DEMO]
    types: [opened, reopened, synchronize]

# Cancel superseded runs when a new commit is pushed to the same PR
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: offline checks (mocks + dummy env values, no real secrets)
  # ---------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: dummy-anon-key
      DATABASE_URL: postgres://test:test@localhost:5432/test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: test
      DB_PASSWORD: dummy-password
      DB_NAME: test
      DB_SSL: "false"

    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (deterministic, from package-lock.json)
        run: npm ci

      - name: Lint (mirrors the local pre-commit check)
        run: npm run lint --if-present

      - name: Build (TypeScript compile)
        run: npm run build

      - name: Unit & integration tests (Jest, mock adapters)
        run: npm test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Secret & credential scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repo belongs to a GitHub organization:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------
  # Job 2: smoke test against the REAL (test) Supabase/Postgres
  # and a booted server. Uses GitHub secrets.
  # ---------------------------------------------------------------
  smoke:
    name: smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets are not available to PRs from forks, so skip there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      NODE_ENV: test
      PORT: "3000"
      HEALTH_PATH: /health          # change to a route your app really serves
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL: ${{ secrets.DB_SSL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify required secrets are present
        run: |
          missing=0
          for v in SUPABASE_URL SUPABASE_ANON_KEY DATABASE_URL DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; missing=1; fi
          done
          exit $missing

      - name: Check database and Supabase connectivity
        run: node scripts/db-check.js

      - name: Start server and verify it responds on the port
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          echo "Waiting for http://localhost:${PORT}${HEALTH_PATH} ..."
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${PORT}${HEALTH_PATH}" > /dev/null; then
              echo "Server is up on port ${PORT} (attempt $i)"
              kill $SERVER_PID
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::Server process exited early"; cat server.log; exit 1
            fi
            sleep 2
          done
          echo "::error::Server did not respond on port ${PORT} within 60s"
          cat server.log
          kill $SERVER_PID || true
          exit 1
