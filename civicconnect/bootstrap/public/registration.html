<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicConnect - New Resident Registration</title>
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Link to external CSS -->
  <link rel="stylesheet" href="css/registration.css" />
</head>
<body>
    <main class="card-container">
        <!-- Left Column: Brand Hero Section -->
    <section class="left-panel">
      <div>
        <div class="brand-header">
          <div class="brand-logo-box">
            <svg class="security-icon-svg" style="width: 1.5rem; height: 1.5rem;" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <circle cx="12" cy="12" r="4"></circle>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">CivicConnect</span>
            <span class="brand-subtitle">Metropolitan Portal</span>
          </div>
        </div>

        <div>
          <h1 class="hero-title">
            Public services,<br />seamlessly<br />coordinated.
          </h1>
          <p class="hero-desc">
            Secure municipal infrastructure coordinating community incident tracking, field dispatch, and neighborhood development.
          </p>
        </div>
      </div>

      <div class="security-pill">
        <div class="security-info">
          <div class="security-icon">
            <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
          <div class="security-text">
            <p>Authentication</p>
            <p>SSH secured</p>
          </div>
        </div>
        <svg viewBox="0 0 24 24";>
          <rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
    </section>
    </main>
  
</body>
</html>
