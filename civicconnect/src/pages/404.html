<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Page not found | CivicConnect</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: radial-gradient(ellipse at top, #1e293b 0, #0f172a 60%);
            color: #f1f5f9;
            font-family: "Public Sans", sans-serif;
        }
        main {
            width: min(100%, 480px);
            padding: 40px;
            border: 1px solid #334155;
            border-radius: 18px;
            background: rgb(30 41 59 / 88%);
            box-shadow: 0 24px 70px rgb(2 6 23 / 40%);
            text-align: center;
        }
        .logo {
            width: 52px;
            height: 52px;
            margin-bottom: 22px;
        }
        .code-message{
            margin: 0;
            color: #60a5fa;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .code {
            margin: 0;
            color: #60a5fa;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        h1 {
            margin: 8px 0 12px;
            font-family: Manrope, sans-serif;
            font-size: 30px;
        }
        .message {
            margin: 0 auto 26px;
            color: #a7b4c7;
            font-size: 14px;
            line-height: 1.6;
        }
        .footer {
            margin-top: 26px;
            color: #a7b4c7;
            font-size: 13px;
        }
        a {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 0 17px;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        a:hover { background: #1d4ed8; }
        a:focus-visible {
            outline: 3px solid rgb(96 165 250 / 50%);
            outline-offset: 3px;
        }
        @media (max-width: 480px) {
            main { padding: 30px 22px; }
            h1 { font-size: 25px; }
        }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/logo.svg" alt="CivicConnect">
        <p class="code-message">ERROR</p>
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p class="message">This page may not exist, or you may not have permission to view it.</p>
        <a href="/src/pages/dashboard.html">Return to dashboard</a>
        <p class="footer">Please contact your administrator for assistance.</p>
    </main>
</body>
</html>
