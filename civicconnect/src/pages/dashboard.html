  <script>
    function selectTicket(id, title, priority, dept, sla, location, tech, desc) {
      document.getElementById('ticketIdBadge').innerText = '#' + id;
      document.getElementById('ticketTitlePreview').innerText = title;
      document.getElementById('ticketPriorityBadge').innerText = priority + ' Priority';
      document.getElementById('ticketDept').innerText = dept;
      document.getElementById('ticketSla').innerText = sla;
      document.getElementById('ticketLocation').innerHTML = '<span class="material-symbols-outlined text-blue icon-small">pin_drop</span> ' + location;
      document.getElementById('technicianName').innerText = tech;
      document.getElementById('ticketDesc').innerText = desc;
    }
  </script>
